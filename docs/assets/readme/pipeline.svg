<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Shop pipeline: source, 5 Hz sampling, person detection, tracking, descriptive policy, evidence clip, human review.">
<style>
  .f { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  .flow { animation: flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -11 } }
  .glow { opacity: 0; animation: glow 7.0s ease-in-out infinite; }
  @keyframes glow { 0% { opacity: 0 } 4% { opacity: 1 } 16% { opacity: 0 } 100% { opacity: 0 } }
  .o { opacity: 0; animation: cyc 9s infinite; }
  .o2 { animation-delay: 3s } .o3 { animation-delay: 6s }
  @keyframes cyc { 0% { opacity: 0; transform: translateY(6px) } 5%,30% { opacity: 1; transform: none } 35%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .flow,.glow { animation: none !important } .o { animation: none !important; opacity: 0 } .o1 { opacity: 1 } }
</style>
